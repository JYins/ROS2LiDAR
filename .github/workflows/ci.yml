name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src/lidar_perception
        run: |
          python -m pytest tests -q

      - name: Check scripts compile
        run: |
          python -m py_compile src/lidar_perception/lidar_perception/*.py scripts/summarize_results.py launch/demo_launch.py

